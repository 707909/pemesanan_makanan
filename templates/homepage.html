<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage - PM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex flex-col min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="flex justify-between m-4 ml-8 me-8 items-center">
            <h1 class="font-bold tracking-wide">OnFood!</h1>
            <div>
                <a class="font-semibold" href="#">Cart</a>
            </div>
        </div>
    </nav>

    <main class="flex bg-green-800 mt-1">
        <div class="p-3 bg-white w-max">
            <h2 class="m-4 ml-8 me-8 it">Menu</h2>
            <div class="grid grid-cols-4 p-2">
                {% for item in menu %}
                <div class="grid grid-cols-3 m-3 gap-5">
                    <h4>{{item.nama}}</h4>
                    <p>{{item.harga}}K</p>
                    <picture>
                        <source srcset="{{ url_for('static', filename='images/' + item.img) }}" type="image/avif">
                        <img src="{{ url_for('static', filename='images/' + item.img) }}" alt="{{ item.nama }}" class="w-40 h-40 object-cover rounded-md mb-3 shadow-sm">
                    </picture>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>
    
</body>
</html>
